<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finanças 360º</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <style>
    :root {
      --bg-blue: #3b6ef6;
      --bg-blue-dark: #254edb;
      --card-blue: #2f5ee0;
      --soft-panel: #dce6fc;
      --white: #ffffff;
      --text-dark: #0f172a;
      --muted: #64748b;
      --green: #16a34a;
      --red: #dc2626;
      --amber: #f59e0b;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      margin: 0;
      background: #1e3a8a;
      color: var(--white);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .phone-frame {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: linear-gradient(180deg, #4b7cf8 0%, var(--bg-blue) 45%, var(--bg-blue-dark) 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .content {
      padding: 16px 16px 84px;
    }

    .top-card {
      background: var(--card-blue);
      border-radius: 18px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1rem;
    }

    .top-card small { display: block; opacity: 0.85; font-size: 0.78rem; }
    .top-card strong { font-size: 1rem; }

    .icon-btn {
      background: rgba(255,255,255,0.16);
      border: none;
      color: var(--white);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .wallet-label { font-size: 0.88rem; opacity: 0.9; margin-bottom: 4px; }
    .wallet-value { font-size: 2rem; font-weight: 800; margin: 0 0 16px; letter-spacing: -0.5px; }

    .summary-box {
      background: var(--soft-panel);
      color: var(--text-dark);
      border-radius: 16px;
      padding: 14px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-bottom: 16px;
    }

    .summary-col { text-align: center; }
    .summary-col:first-child { border-right: 1px solid rgba(15, 23, 42, 0.14); }
    .summary-col small { display: block; color: var(--muted); font-size: 0.78rem; margin-bottom: 4px; }
    .val-in { color: var(--green); font-weight: 800; font-size: 1.05rem; }
    .val-out { color: var(--red); font-weight: 800; font-size: 1.05rem; }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .action-btn {
      border: none;
      border-radius: 14px;
      padding: 14px 12px;
      color: var(--white);
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-receita { background: var(--green); }
    .btn-despesa { background: var(--red); }

    .panel {
      background: var(--card-blue);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .panel h3 {
      margin: 0 0 12px;
      font-size: 0.98rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.78rem; opacity: 0.9; margin-bottom: 4px; }
    .field input, .field select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: var(--white);
      color: var(--text-dark);
      font-size: 0.92rem;
    }

    .btn-save {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #10b981;
      color: var(--white);
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .recent-item {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 11px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .recent-item:last-child { margin-bottom: 0; }
    .recent-left strong { display: block; font-size: 0.92rem; }
    .recent-left small { opacity: 0.8; font-size: 0.76rem; }
    .recent-right { text-align: right; font-weight: 700; font-size: 0.92rem; }
    .recent-right small { display: block; font-weight: 500; font-size: 0.75rem; opacity: 0.85; }

    .toast {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.84rem;
      text-align: center;
      display: none;
      font-weight: 600;
    }

    .toast.ok { display: block; background: #dcfce7; color: #166534; }
    .toast.warn { display: block; background: #fef3c7; color: #92400e; }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      background: #1d4ed8;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 8px 12px;
      gap: 8px;
    }

    .nav-btn {
      border: none;
      border-radius: 12px;
      padding: 10px;
      background: transparent;
      color: rgba(255,255,255,0.78);
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
    }

    .nav-btn.active {
      background: var(--amber);
      color: var(--text-dark);
    }

    .hidden { display: none; }
    .config-box { display: none; background: rgba(15, 23, 42, 0.35); padding: 12px; border-radius: 12px; margin-bottom: 14px; }
    .config-box.open { display: block; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="content">
      <div class="top-card">
        <div class="user-info">
          <div class="avatar">A</div>
          <div>
            <small>Bem-vindo,</small>
            <strong>Alexandre</strong>
          </div>
        </div>
        <div style="display:flex; gap:6px;">
          <button type="button" class="icon-btn" onclick="atualizarDados(true)">↻</button>
          <button type="button" class="icon-btn" onclick="toggleConfig()">⚙️</button>
        </div>
      </div>

      <div id="configBox" class="config-box">
        <div class="field">
          <label>URL do Web App (Apps Script)</label>
          <input type="url" id="apiUrl" />
        </div>
        <div class="field">
          <label>Token</label>
          <input type="text" id="apiToken" />
        </div>
        <button type="button" class="btn-save" onclick="salvarConfig()">Salvar</button>
      </div>

      <div id="viewInicio">
        <div class="wallet-label">Carteira Total</div>
        <h1 id="saldoTotal" class="wallet-value">R$ 0,00</h1>

        <div class="summary-box">
          <div class="summary-col">
            <small>Receita</small>
            <span id="totalReceita" class="val-in">+ R$ 0,00</span>
          </div>
          <div class="summary-col">
            <small>Despesas</small>
            <span id="totalDespesa" class="val-out">- R$ 0,00</span>
          </div>
        </div>

        <div class="quick-actions">
          <button type="button" class="action-btn btn-receita" onclick="abrirNovoLancamento('ENTRADA')">
            ↗ Adicionar Receita
          </button>
          <button type="button" class="action-btn btn-despesa" onclick="abrirNovoLancamento('SAÍDA')">
            ↘ Adicionar Despesa
          </button>
        </div>

        <form id="formLancamento" class="panel">
          <h3 id="tituloForm">Novo Lançamento (Saída)</h3>

          <div class="row-2">
            <div class="field">
              <label>Data</label>
              <input type="date" id="data" required />
            </div>
            <div class="field">
              <label>Valor (R$)</label>
              <input type="number" id="valor" step="0.01" min="0.01" placeholder="0,00" required />
            </div>
          </div>

          <div class="row-2">
            <div class="field">
              <label>Categoria</label>
              <select id="categoria" required></select>
            </div>
            <div class="field">
              <label>Forma de Pagamento</label>
              <select id="formaPagamento" required>
                <option value="PIX">PIX</option>
                <option value="Cartão de Crédito">Cartão de Crédito</option>
                <option value="Cartão de Débito">Cartão de Débito</option>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Transferência (TED/DOC)">Transferência (TED/DOC)</option>
              </select>
            </div>
          </div>

          <div class="row-2">
            <div class="field">
              <label>Instituição</label>
              <select id="instituicao" required>
                <option value="Banco Inter">Banco Inter</option>
                <option value="Banco do Brasil">Banco do Brasil</option>
                <option value="Mercado Pago">Mercado Pago</option>
                <option value="Dinheiro em Espécie">Dinheiro em Espécie</option>
              </select>
            </div>
            <div class="field">
              <label>Descrição</label>
              <input type="text" id="descricao" placeholder="Ex.: Mercado, Salário..." required />
            </div>
          </div>

          <button type="submit" id="btnSalvar" class="btn-save">Salvar Rápido</button>
          <div id="toast" class="toast"></div>
        </form>
      </div>

      <div id="viewUltimos5" class="hidden">
        <div class="panel">
          <h3>
            <span>Últimos 5 Lançamentos</span>
            <button type="button" class="icon-btn" onclick="atualizarDados(true)">Atualizar</button>
          </h3>
          <div id="listaUltimos5"></div>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <button type="button" id="navInicio" class="nav-btn active" onclick="mudarAba('inicio')">🏠 Início</button>
      <button type="button" id="navUltimos5" class="nav-btn" onclick="mudarAba('ultimos5')">📋 Últimos 5</button>
    </div>
  </div>

  <script>
    const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbxcgEl9JXm7aYPqtXCLpUTa-qsPXNaPc_YJEUHU1Zu9Wv1hePhHGBH1gL7K0vsGJJl9NA/exec";
    const DEFAULT_TOKEN = "WORKANA_FIN_2026";

    let tipoSelecionado = "SAÍDA";
    const categoriasPorTipo = {
      "ENTRADA": ["Salário", "Freelance / Consultoria", "Dividendos & Investimentos", "Outras Receitas"],
      "SAÍDA": ["Alimentação & Supermercado", "Moradia & Contas", "Transporte & Combustível", "Saúde & Bem-estar", "Lazer & Restaurantes", "Compras Pessoais"]
    };

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("data").valueAsDate = new Date();
      document.getElementById("apiUrl").value = localStorage.getItem("fin_api_url") || DEFAULT_API_URL;
      document.getElementById("apiToken").value = localStorage.getItem("fin_api_token") || DEFAULT_TOKEN;

      abrirNovoLancamento("SAÍDA");
      renderizarCacheNaTela();
      atualizarDados(false);
    });

    function mudarAba(aba) {
      const isInicio = aba === "inicio";
      document.getElementById("viewInicio").classList.toggle("hidden", !isInicio);
      document.getElementById("viewUltimos5").classList.toggle("hidden", isInicio);
      document.getElementById("navInicio").classList.toggle("active", isInicio);
      document.getElementById("navUltimos5").classList.toggle("active", !isInicio);
      if (!isInicio) renderizarUltimos5();
    }

    function toggleConfig() {
      document.getElementById("configBox").classList.toggle("open");
    }

    function salvarConfig() {
      localStorage.setItem("fin_api_url", document.getElementById("apiUrl").value.trim());
      localStorage.setItem("fin_api_token", document.getElementById("apiToken").value.trim());
      mostrarToast("Configuração salva!", "ok");
      atualizarDados(true);
    }

    function abrirNovoLancamento(tipo) {
      tipoSelecionado = tipo;
      document.getElementById("tituloForm").textContent =
        tipo === "ENTRADA" ? "Nova Receita (+)" : "Nova Despesa (-)";
      const selCat = document.getElementById("categoria");
      selCat.innerHTML = (categoriasPorTipo[tipo] || [])
        .map(c => `<option value="${c}">${c}</option>`).join("");
      mudarAba("inicio");
      document.getElementById("valor").focus();
    }

    function formatarMoeda(v) {
      return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function renderizarCacheNaTela() {
      const resumo = JSON.parse(localStorage.getItem("fin_resumo_cache") || '{"saldo":0,"receita":0,"despesa":0}');
      document.getElementById("saldoTotal").textContent = formatarMoeda(resumo.saldo);
      document.getElementById("totalReceita").textContent = `+ ${formatarMoeda(resumo.receita)}`;
      document.getElementById("totalDespesa").textContent = `- ${formatarMoeda(resumo.despesa)}`;
      renderizarUltimos5();
    }

    function obterListaCombinadaUltimos5() {
      const locais = JSON.parse(localStorage.getItem("fin_recentes_locais") || "[]");
      const remotos = JSON.parse(localStorage.getItem("fin_recentes_remotos") || "[]");
      return [...locais, ...remotos].slice(0, 5);
    }

    function renderizarUltimos5() {
      const lista = obterListaCombinadaUltimos5();
      const container = document.getElementById("listaUltimos5");
      if (!lista.length) {
        container.innerHTML = `<p style="opacity:0.8;font-size:0.86rem;margin:0;">Nenhum lançamento recente encontrado.</p>`;
        return;
      }
      container.innerHTML = lista.map(item => {
        const isEntrada = item.tipo === "ENTRADA";
        const sinal = isEntrada ? "+" : "-";
        const cor = isEntrada ? "#86efac" : "#fca5a5";
        return `
          <div class="recent-item">
            <div class="recent-left">
              <strong>${item.descricao || item.categoria}</strong>
              <small>${item.data} • ${item.formaPagamento || item.instituicao || ""}</small>
            </div>
            <div class="recent-right" style="color:${cor};">
              ${sinal} ${formatarMoeda(item.valor)}
              <small>${item.categoria || ""}</small>
            </div>
          </div>
        `;
      }).join("");
    }

    async function atualizarDados(mostrarFeedback) {
      const url = (document.getElementById("apiUrl").value || DEFAULT_API_URL).trim();
      const token = (document.getElementById("apiToken").value || DEFAULT_TOKEN).trim();
      if (!url) return;

      try {
        const res = await fetch(`${url}?token=${encodeURIComponent(token)}`, { cache: "no-store" });
        const json = await res.json();
        if (json.status === "success") {
          if (Array.isArray(json.ultimos5)) {
            localStorage.setItem("fin_recentes_remotos", JSON.stringify(json.ultimos5.slice(0, 5)));
            localStorage.removeItem("fin_recentes_locais");
          }
          if (json.resumo) {
            localStorage.setItem("fin_resumo_cache", JSON.stringify(json.resumo));
          }
          renderizarCacheNaTela();
          if (mostrarFeedback) mostrarToast("Sincronizado com a planilha!", "ok");
        }
      } catch (e) {
        if (mostrarFeedback) mostrarToast("Sem conexão agora; exibindo dados locais.", "warn");
      }
    }

    document.getElementById("formLancamento").addEventListener("submit", (e) => {
      e.preventDefault();
      const url = (document.getElementById("apiUrl").value || DEFAULT_API_URL).trim();
      const token = (document.getElementById("apiToken").value || DEFAULT_TOKEN).trim();

      const valorNum = parseFloat(document.getElementById("valor").value);
      const dataIso = document.getElementById("data").value;
      const [ano, mes, dia] = dataIso.split("-");
      const dataBr = `${dia}/${mes}/${ano}`;

      const registro = {
        token,
        data: dataIso,
        dataFormatada: dataBr,
        tipo: tipoSelecionado,
        categoria: document.getElementById("categoria").value,
        descricao: document.getElementById("descricao").value.trim(),
        instituicao: document.getElementById("instituicao").value,
        formaPagamento: document.getElementById("formaPagamento").value,
        valor: valorNum,
        status: "Confirmado"
      };

      // Atualiza tela na hora sem esperar resposta lenta
      const locais = JSON.parse(localStorage.getItem("fin_recentes_locais") || "[]");
      locais.unshift({
        data: dataBr,
        tipo: registro.tipo,
        categoria: registro.categoria,
        descricao: registro.descricao,
        instituicao: registro.instituicao,
        formaPagamento: registro.formaPagamento,
        valor: registro.valor
      });
      localStorage.setItem("fin_recentes_locais", JSON.stringify(locais.slice(0, 5)));

      const resumo = JSON.parse(localStorage.getItem("fin_resumo_cache") || '{"saldo":0,"receita":0,"despesa":0}');
      if (registro.tipo === "ENTRADA") {
        resumo.receita = Number(resumo.receita || 0) + valorNum;
        resumo.saldo = Number(resumo.saldo || 0) + valorNum;
      } else if (registro.tipo === "SAÍDA") {
        resumo.despesa = Number(resumo.despesa || 0) + valorNum;
        resumo.saldo = Number(resumo.saldo || 0) - valorNum;
      }
      localStorage.setItem("fin_resumo_cache", JSON.stringify(resumo));
      renderizarCacheNaTela();

      document.getElementById("valor").value = "";
      document.getElementById("descricao").value = "";
      mostrarToast("Salvo na hora! Enviando à planilha...", "ok");

      // Envio em segundo plano sem bloquear o botão
      fetch(url, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(registro)
      }).catch(() => {});
    });

    function mostrarToast(msg, tipo) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.className = `toast ${tipo}`;
      setTimeout(() => { el.style.display = "none"; }, 3000);
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>

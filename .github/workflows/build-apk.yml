name: Gerar APK Financas 360

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar pasta www e compilar Android
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/ 2>/dev/null || true
          sed -i 's/"webDir": "\."/"webDir": "www"/g' capacitor.config.json
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Baixar APK Pronto
        uses: actions/upload-artifact@v4
        with:
          name: Financas-360-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

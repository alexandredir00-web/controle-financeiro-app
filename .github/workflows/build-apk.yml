name: Build Android APK (TWA)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate keystore and build APK
        run: |
          set -e
          keytool -genkeypair -v -keystore release.keystore -alias financas -keyalg RSA -keysize 2048 -validity 10000 -storepass senha123 -keypass senha123 -dname "CN=Financas360, OU=App, O=Workana, L=Bacabal, S=MA, C=BR"

          mkdir -p twa-app && cd twa-app
          printf "n\ny\n" | bubblewrap init --manifest="https://alexandredir00-web.github.io/controle-financeiro-app/manifest.json" --yes || true

          if [ ! -f twa-manifest.json ]; then
            cat <<'EOF' > twa-manifest.json
{
  "packageId": "com.alexandredir00.financas360",
  "host": "alexandredir00-web.github.io",
  "name": "Finanças 360º",
  "launcherName": "Finanças 360",
  "display": "standalone",
  "themeColor": "#206a4e",
  "navigationColor": "#206a4e",
  "navigationColorDark": "#164b37",
  "navigationDividerColor": "#206a4e",
  "navigationDividerColorDark": "#164b37",
  "backgroundColor": "#f3f6f4",
  "enableNotifications": false,
  "startUrl": "/controle-financeiro-app/index.html",
  "iconUrl": "https://cdn-icons-png.flaticon.com/512/2489/2489756.png",
  "splashScreenFadeOutDuration": 300,
  "signingKey": {
    "path": "../release.keystore",
    "alias": "financas"
  },
  "appVersionName": "1.0.0",
  "appVersionCode": 1,
  "shortcuts": [],
  "generatorApp": "bubblewrap-cli",
  "webManifestUrl": "https://alexandredir00-web.github.io/controle-financeiro-app/manifest.json",
  "fallbackType": "customtabs",
  "features": {
    "locationDelegation": {
      "enabled": false
    },
    "playBilling": {
      "enabled": false
    }
  },
  "alphaDependencies": {
    "enabled": false
  },
  "enableSiteSettingsShortcut": true,
  "isChromeOSOnly": false,
  "minSdkVersion": 21,
  "orientation": "portrait",
  "fingerprints": [],
  "additionalTrustedOrigins": [],
  "retainedBundles": [],
  "protocolHandlers": [],
  "fileHandlers": [],
  "launchHandlerClientMode": "",
  "displayOverride": []
}
EOF
          else
            sed -i 's/"packageId": "[^"]*"/"packageId": "com.alexandredir00.financas360"/' twa-manifest.json
            sed -i 's|"launcherName": "[^"]*"|"launcherName": "Finanças 360"|' twa-manifest.json
            sed -i 's|"path": "[^"]*"|"path": "../release.keystore"|' twa-manifest.json
            sed -i 's/"alias": "[^"]*"/"alias": "financas"/' twa-manifest.json
          fi

          yes | bubblewrap update --yes
          yes | bubblewrap build --skipPwaValidation

          find . -name "*.apk" -maxdepth 4 -exec cp {} /tmp/app-release-signed.apk \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: financas-360-apk
          path: /tmp/app-release-signed.apk

name: Build Android APK (TWA)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android Command Line Tools & Bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y unzip wget
          mkdir -p android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d android-sdk/cmdline-tools
          mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
          export ANDROID_HOME=$PWD/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          npm install -g @bubblewrap/cli

      - name: Generate keystore and TWA project
        run: |
          export ANDROID_HOME=$PWD/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          keytool -genkeypair -v -keystore release.keystore -alias financas -keyalg RSA -keysize 2048 -validity 10000 -storepass senha123 -keypass senha123 -dname "CN=Financas360, OU=App, O=Workana, L=Bacabal, S=MA, C=BR"
          mkdir -p twa-app && cd twa-app
          bubblewrap init --manifest="https://alexandredir00-web.github.io/controle-financeiro-app/manifest.json" --yes
          sed -i 's/"packageId": "[^"]*"/"packageId": "com.alexandredir00.financas360"/' twa-manifest.json
          sed -i 's|"launcherName": "[^"]*"|"launcherName": "Finanças 360"|' twa-manifest.json
          sed -i "s|keytoolPath.*||" twa-manifest.json || true
          bubblewrap update --yes
          bubblewrap build --skipPwaValidation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: financas-360-apk
          path: twa-app/app-release-signed.apk
